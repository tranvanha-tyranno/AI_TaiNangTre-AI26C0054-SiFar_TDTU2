# Submission defaults; Docker workdir is /.
xlsx_dir: ./input/xlsx_files
queries: ./input/queries.json
output: ./output/submission.csv

model: qwen/qwen3.7-flash
base_url: https://openrouter.ai/api/v1
concurrency: 1

# Shared cost/time limits, including retries.
max_cost_per_question: 0.10
question_timeout: 115
run_timeout: 2400
max_prompt_price_per_million: 1.0
max_completion_price_per_million: 4.0
max_tokens_plan: 3000
llm_seed: 42
max_api_calls: 8
max_plan_repairs: 4
max_inspection_rounds: 3

max_workbook_cells: 200000
retrieval_top_k: 6
preview_rows: 60
semantic_review: all
v3_deduplicate_context: true
v3_reliability: true
v3_error_memory: true
v3_program_tools: true
error_memory_path: config/error_memory.json
error_memory_top_k: 3
error_memory_max_chars: 3600
