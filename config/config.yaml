xlsx_dir: ./Public_data_1/xlsx_files
queries: ./Public_data_1/queries.json
output: ./outputs/submission.csv

# LLM
model: qwen/qwen3-7-flash
base_url: https://openrouter.ai/api/v1
# Đặt OPENROUTER_API_KEY trong env, không ghi vào đây

# Giới hạn đề thi
max_tokens_plan: 3000
llm_seed: 42  # Used only when the configured model advertises seed support.
max_cost_per_question: 0.10
max_api_calls: 4
max_plan_repairs: 2
max_inspection_rounds: 2
semantic_review: risky  # off | risky (labels, joins, ratios, unit conversion) | all
question_timeout: 115
run_timeout: 2400
# Provider price caps in USD per million tokens; API rejects more expensive routes.
max_prompt_price_per_million: 1.0
max_completion_price_per_million: 4.0
max_workbook_cells: 200000
retrieval_top_k: 4
preview_rows: 45

# Pipeline
mode: llm  # LLM + Tools là luồng xử lý duy nhất
concurrency: 1
# Dùng --mode llm-v2 để bật khám phá/review sâu; mode mặc định giữ baseline.

# LMMv3 only: independent limits; earlier variants unchanged.
v3_max_api_calls: 8
v3_max_repairs: 3
v3_max_inspections: 3
